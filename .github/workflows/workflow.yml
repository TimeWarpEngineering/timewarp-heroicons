name: CI/CD

# Thin trigger. The CI/CD pipeline lives in C# — the `dev workflow` command — and is mode-aware:
# push/PR run clean->build->test; a published release verifies tag == props <Version>, then runs
# clean->build->pack->push (no test gate). Publishing happens ONLY on the `release` event.
# No schedule here: the monthly icon sync lives in sync-icons.yml, so this workflow (which nuget.org
# trusted publishing is bound to) is never disabled for inactivity. See readme "Syncing icons and releasing".

on:
  push:
    branches: [ master ]
    paths:
      - 'source/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'releases.md'
  pull_request:
    branches: [ master, 'feature/**']
    paths:
      - 'source/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'releases.md'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: 'merge = normal CI (default). probe = trusted-publishing check only (OIDC login, no build, no publish).'
        type: choice
        options:
          - merge
          - probe
        default: merge

defaults:
  run:
    shell: pwsh

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: NuGet login (OIDC Trusted Publishing)
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
        id: nuget-login
        uses: nuget/login@v1
        with:
          user: TimeWarp.Enterprises

      - name: Trusted publishing probe result
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
        run: Write-Output "Trusted publishing OK — OIDC exchange succeeded for this repo + workflow.yml. (A failure of the NuGet login step above means the policy is missing or misconfigured on NuGet.org.)"

      - name: Run CI Pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'probe'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            dotnet run tools/dev-cli/dev.cs -- workflow --mode release --release-tag $env:RELEASE_TAG --api-key $env:NUGET_API_KEY
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            dotnet run tools/dev-cli/dev.cs -- workflow --mode merge
          } else {
            dotnet run tools/dev-cli/dev.cs -- workflow
          }
          exit $LASTEXITCODE

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Packages-${{ github.run_number }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: ignore